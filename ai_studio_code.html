<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur TJM Freelance - Estimez votre tarif</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-6 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
        <h1 class="text-2xl font-bold text-center text-indigo-600 mb-2">FreelanceRate ⚡</h1>
        <p class="text-sm text-gray-500 text-center mb-6">Calculez le tarif journalier (TJM) idéal pour atteindre vos objectifs financiers.</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Salaire mensuel net visé (€)</label>
                <input type="number" id="salary" placeholder="ex: 2500" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Frais pro / charges mensuelles (€)</label>
                <input type="number" id="expenses" placeholder="ex: 300" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Jours facturés par mois (Moyenne : 15)</label>
                <input type="number" id="days" placeholder="ex: 15" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <button onclick="calculateTJM()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition">
                Calculer mon TJM recommandé
            </button>
        </div>

        <div id="result" class="hidden mt-6 p-4 bg-indigo-50 border border-indigo-100 rounded-xl text-center">
            <p class="text-xs uppercase tracking-wide text-gray-500">Votre tarif minimal conseillé :</p>
            <p class="text-3xl font-extrabold text-indigo-600 my-1"><span id="tjmValue">0</span> € / jour</p>
            <p class="text-xs text-gray-400 mb-4">(Inclut ~25% de cotisations Urssaf)</p>

            <!-- SECTION MONÉTISATION AUTOMATISÉE -->
            <div class="mt-4 pt-4 border-t border-indigo-200">
                <p class="text-sm font-semibold text-gray-700 mb-2">Prêt à facturer ? Évitez les impayés.</p>
                <!-- Remplace le lien ci-dessous par ton lien de paiement Gumroad ou Stripe -->
                <a href="https://gumroad.com" target="_blank" class="inline-block w-full bg-emerald-500 hover:bg-emerald-600 text-white text-sm font-bold py-2.5 px-4 rounded-lg shadow transition">
                    Obtenir le Pack Contrat + Devis Pro (9,90 €)
                </a>
            </div>
        </div>
    </div>

    <script>
        function calculateTJM() {
            const salary = parseFloat(document.getElementById('salary').value) || 0;
            const expenses = parseFloat(document.getElementById('expenses').value) || 0;
            const days = parseFloat(document.getElementById('days').value) || 15;

            if(salary <= 0 || days <= 0) {
                alert("Veuillez remplir correctement les champs.");
                return;
            }

            // Calcul : (Salaire brut estimé + charges) / jours
            const grossSalary = salary * 1.30; 
            const totalMonthly = grossSalary + expenses;
            const tjm = Math.round(totalMonthly / days);

            document.getElementById('tjmValue').innerText = tjm;
            document.getElementById('result').classList.remove('hidden');
        }
    </script>
</body>
</html>
